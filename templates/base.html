<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Last Resort Data Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script defer src="{{ url_for('static', filename='portal.js') }}"></script>
</head>
<body>
    <header class="portal-header">
        <div>
            <p class="eyebrow">Flask + SQLite web demo</p>
            <h1>Last Resort Hotels Data Portal</h1>
            <p class="lede">A staff-facing portal for exploring hotel rooms, billing, events, guests, and SQL query outputs.</p>
        </div>
        <nav class="portal-nav" aria-label="Portal pages">
            <a class="{{ 'active' if active_page == 'overview' else '' }}" href="{{ url_for('overview') }}">Overview</a>
            <a class="{{ 'active' if active_page == 'rooms' else '' }}" href="{{ url_for('rooms') }}">Rooms</a>
            <a class="{{ 'active' if active_page == 'billing' else '' }}" href="{{ url_for('billing') }}">Billing</a>
            <a class="{{ 'active' if active_page == 'events' else '' }}" href="{{ url_for('events') }}">Events</a>
            <a class="{{ 'active' if active_page == 'guests' else '' }}" href="{{ url_for('guests') }}">Guests</a>
            <a class="{{ 'active' if active_page == 'queries' else '' }}" href="{{ url_for('query_outputs') }}">Query Outputs</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
